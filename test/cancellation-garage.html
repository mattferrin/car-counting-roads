<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Subtraction Play — Counting Worlds (Test)</title><meta name="description" content="Free play with positive and negative differences. Match cars in the cancellation garage, move tens and ones, and see what remains."><link rel="stylesheet" href="cancellation-quest.css?v=14"><link rel="stylesheet" href="storybook.css?v=25"><link rel="stylesheet" href="cancellation-garage.css?v=3"><link rel="stylesheet" href="play-capacity.css?v=1"></head><body data-theme="cars"><svg width="0" height="0" style="position:absolute" aria-hidden="true">

      <circle cx="31" cy="20" r="4.2" fill="#22303c"/><circle cx="31" cy="20" r="1.8" fill="#d7e3ef"/>
    </symbol>
    <symbol id="car-gold" viewBox="0 0 44 26">
      <rect x="3" y="12" width="38" height="8" rx="4" fill="#f2b705"/>
      <path d="M12 12 C12 5 16 2.5 22 2.5 C28 2.5 32 5 32 12 Z" fill="#f2b705"/>

      <circle cx="13" cy="20" r="4.2" fill="#22303c"/><circle cx="13" cy="20" r="1.8" fill="#d7e3ef"/>
      <circle cx="31" cy="20" r="4.2" fill="#22303c"/><circle cx="31" cy="20" r="1.8" fill="#d7e3ef"/>

    <symbol id="mermaid-teal" viewBox="0 0 44 30"><image href="art/mermaid-selector-M.svg" width="44" height="30"/></symbol>
    <symbol id="mermaid-pink" viewBox="0 0 44 30"><image href="art/mermaid-selector-M.svg" width="44" height="30"/></symbol>
  </defs>
</svg><main id="game" class="page cancellation-garage">  <header class="eqbar">
    <p class="world-line" id="world-line">Ayan's Car World · Subtraction Play</p>
    <div class="equation" role="heading" aria-label="Blue minus Gold equals difference">
      <span id="left">10</span><span class="op">−</span><span id="right">0</span><span class="op">=</span><span id="total" class="garage-result">10</span>
    </div>
    <div class="toggles">
      <div class="theme-switch" role="group" aria-label="Choose a world"><button type="button" class="pill theme-pill" data-theme="cars" aria-pressed="true"><svg viewBox="0 0 44 26" width="22" height="13" style="vertical-align:-2px" aria-hidden="true"><use href="#car-blue"/></svg> Ayan</button>
      <button type="button" class="pill theme-pill" data-theme="mermaids" aria-pressed="false"><img src="art/mermaid-selector-M.svg" width="20" height="14" style="vertical-align:-2px" alt=""> Aliya</button></div>
    </div>
  </header>

<div class="garage-board"><svg id="garage-map" viewBox="0 0 480 590" role="group" aria-label="Subtraction Play: eight roads for tens and ones"><g id="scenery" aria-hidden="true"></g><g id="roads"></g><g id="shells"></g><g id="pairs" aria-hidden="true"></g><g id="units" aria-hidden="true"></g><g id="controls"></g><g id="effects" aria-hidden="true"></g></svg></div>
<div class="play-limit"><div id="play-capacity" class="capacity-picker" role="radiogroup" aria-label="Count up to"><span class="capacity-highlight" aria-hidden="true"></span><button type="button" data-max="20" role="radio" aria-checked="true">20</button><button type="button" data-max="50" role="radio" aria-checked="false">50</button><button type="button" data-max="100" role="radio" aria-checked="false">100</button></div></div><p id="feedback" class="game-announcements" role="status" aria-live="polite"></p>

</main><script src="play-controls.js?v=1"></script><script src="play-capacity.js?v=1"></script><script src="cancellation-garage-engine.js?v=4"></script><script src="cancellation-garage.js?v=5"></script></body></html>
