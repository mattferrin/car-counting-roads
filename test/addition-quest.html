<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Addition Quest — Ayan &amp; Aliya's Counting Worlds (Test)</title>
<link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="./site.webmanifest?v=2">
<meta name="apple-mobile-web-app-title" content="Count Ones">
<meta name="description" content="An addition game for kids: move everything from the smaller side to the bigger side, tens first then ones, and watch what is left become the answer.">
<!-- Asset cache-busting: every local CSS/JS URL below carries ?v=N.
     Bump N on ALL of them together on every deploy, so a phone can
     never mix a cached old file with a new one. Audio files are
     intentionally unversioned (63 shared clips; re-downloading them
     every deploy would be wasteful). -->
<link rel="stylesheet" href="addition-quest.css?v=20">
<link rel="stylesheet" href="storybook.css?v=32">
</head>
<body data-theme="cars">
<!-- Inline SVG symbols: every car is one car, every mermaid is one mermaid.
     No x10 badges anywhere: a group of ten is ten separate symbols in a row. -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="car-blue" viewBox="0 0 44 26"><path d="M3 10Q3 6 8 6H32L38 11Q41 12 41 15V19H3Z" fill="#2f7fe0"/><path d="M7 9H18V13H7Z M21 9H29V13H21Z M32 10H35L37 13H32Z" fill="#cfeaff"/><rect x="10" y="14" width="23" height="2" rx="0.5" fill="#65b8ff"/><path d="M8 5V2H33V5" fill="none" stroke="#354957" stroke-width="1.5"/><rect x="18" y="2" width="7" height="1.5" rx="0.3" fill="#e6a756"/><path d="M4 17H40" stroke="#1556a0" stroke-width=".65" opacity=".6"/><circle cx="12" cy="20" r="3.8" fill="#22303c"/><circle cx="12" cy="20" r="1.55" fill="#d7e3ef"/><circle cx="33" cy="20" r="3.8" fill="#22303c"/><circle cx="33" cy="20" r="1.55" fill="#d7e3ef"/><rect x="39" y="15" width="2" height="2.2" rx=".7" fill="#fff4c1"/></symbol>
    <symbol id="car-gold" viewBox="0 0 44 26"><path d="M3 10Q3 6 8 6H32L38 11Q41 12 41 15V19H3Z" fill="#f2b705"/><path d="M7 9H18V13H7Z M21 9H29V13H21Z M32 10H35L37 13H32Z" fill="#fff3c4"/><rect x="10" y="14" width="23" height="2" rx="0.5" fill="#ffdb50"/><path d="M8 5V2H33V5" fill="none" stroke="#354957" stroke-width="1.5"/><rect x="18" y="2" width="7" height="1.5" rx="0.3" fill="#e6a756"/><path d="M4 17H40" stroke="#c28200" stroke-width=".65" opacity=".6"/><circle cx="12" cy="20" r="3.8" fill="#22303c"/><circle cx="12" cy="20" r="1.55" fill="#d7e3ef"/><circle cx="33" cy="20" r="3.8" fill="#22303c"/><circle cx="33" cy="20" r="1.55" fill="#d7e3ef"/><rect x="39" y="15" width="2" height="2.2" rx=".7" fill="#fff4c1"/></symbol>
    <symbol id="mermaid-teal" viewBox="0 0 460 266"><image href="art/berry-star.png?v=1" width="460" height="266"/></symbol>
    <symbol id="mermaid-pink" viewBox="0 0 460 266"><image href="art/berry-star.png?v=1" width="460" height="266"/></symbol>
  </defs>
</svg>

<div class="page">
  <header class="eqbar">
    <p class="world-line">Ayan's Car World · Addition Quest</p>
    <div class="equation" role="heading" aria-label="Addition problem">
      <span id="eq-a">47</span><span class="op">+</span><span id="eq-b">26</span><span class="op">=</span><span class="q" id="eq-q">?</span>
    </div>
    <div class="toggles">
      <div class="theme-switch" role="group" aria-label="Choose a world"><span class="theme-highlight" aria-hidden="true"></span><button type="button" class="pill theme-pill" data-theme="cars" aria-pressed="true"><svg viewBox="0 0 44 26" width="22" height="13" style="vertical-align:-2px" aria-hidden="true"><use href="#car-gold"/></svg> Ayan</button>
      <button type="button" class="pill theme-pill" data-theme="mermaids" aria-pressed="false"><img src="art/berry-star.png?v=1" width="20" height="14" style="width:20px;height:14px;vertical-align:-2px;object-fit:contain" alt="" aria-hidden="true"> Aliya</button></div>
      <button type="button" class="pill sound" id="sound-toggle" aria-pressed="true">⏳ Getting sound ready…</button>
    </div>
  </header>

  <!-- The celebration banner: big cheer + big New Mystery button, right
       under the equation bar — impossible to miss when solved. -->
  <div class="celebrate-banner" id="celebrate-banner" hidden>
    <p class="cheer" id="cheer" hidden></p>
    <button type="button" class="new-mystery" id="new-mystery" hidden disabled>✨ New Mystery</button>
  </div>

  <main>
    <!-- Two compact landmark strips hugging the panels: four above,
         four below. The back-home link lives in the footer now, so
         nothing crowds the equation and the top strip. -->
    <div class="landmark-strip above-strip" id="landmarks-above" aria-label="Places above the numbers — tap one to move"></div>
    <section class="quantities" aria-label="The two quantities">
      <div class="side left" id="side-left">
        <div class="who"><span class="wrow"><span class="dot"></span><span class="who-label">Blue cars</span></span><span class="size-badge" id="left-size">bigger</span></div>
        <div class="bignum" id="left-num">47</div>
        <p class="caption" id="left-cap">4 tens · 7 ones</p>
        <div class="grid" id="left-grid"></div>
      </div>
      <div class="plus-badge" aria-hidden="true">+</div>
      <div class="side right" id="side-right">
        <div class="who"><span class="wrow"><span class="dot"></span><span class="who-label">Gold cars</span></span><span class="size-badge" id="right-size">smaller</span></div>
        <div class="bignum" id="right-num">26</div>
        <p class="caption" id="right-cap">2 tens · 6 ones</p>
        <div class="grid" id="right-grid"></div>
      </div>
    </section>

    <div class="landmark-strip below-strip" id="landmarks-below" aria-label="Places below the numbers — tap one to move"></div>

    <!-- Keep narration and move announcements available to assistive technology. -->
    <div class="game-announcements">
      <p class="total-badge" id="total-badge">Total stays 73</p>
    <p class="moved" id="moved-tally" hidden></p>
    <p id="progress-status" role="status"></p>

    <div class="caption-bar" id="captions" aria-live="polite">
      <p class="line note">Tap a place on the map to move!</p>
    </div>
    </div>
  </main>

  <footer class="quest-footer">
    <nav class="footer-nav" aria-label="Game navigation">
      <a class="footer-home" href="index.html">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
        <span>All games</span>
      </a>
    </nav>
  </footer>
</div>

<!-- ?v=16 on every script — bump together with the stylesheet on every deploy (see the cache-busting note in <head>). -->
<script src="addition-engine.js?v=16"></script>
<script src="addition-layout.js?v=16"></script>
<script src="theme-switch.js?v=4"></script>
<script src="addition-quest.js?v=23"></script>
</body>
</html>
